id = "javoscript.herdr-pickr"
name = "Herdr Pickr"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Fuzzy tab, space, and agent pickers with terminal previews."
platforms = ["macos", "linux"]

[[actions]]
id = "tabs-current"
title = "Pickr: tabs in current space"
contexts = ["global"]
command = ["lua", "src/open.lua", "tabs-current"]

[[actions]]
id = "tabs-all"
title = "Pickr: tabs in all spaces"
contexts = ["global"]
command = ["lua", "src/open.lua", "tabs-all"]

[[actions]]
id = "spaces"
title = "Pickr: spaces"
contexts = ["global"]
command = ["lua", "src/open.lua", "spaces"]

[[actions]]
id = "agents-current"
title = "Pickr: agents in current space"
contexts = ["global"]
command = ["lua", "src/open.lua", "agents-current"]

[[actions]]
id = "agents-all"
title = "Pickr: agents in all spaces"
contexts = ["global"]
command = ["lua", "src/open.lua", "agents-all"]

[[panes]]
id = "tabs-current"
title = "pickr"
placement = "popup"
width = "80%"
height = "70%"
command = ["lua", "src/main.lua", "tabs", "current"]

[[panes]]
id = "tabs-all"
title = "pickr"
placement = "popup"
width = "80%"
height = "70%"
command = ["lua", "src/main.lua", "tabs", "all"]

[[panes]]
id = "spaces"
title = "pickr"
placement = "popup"
width = "80%"
height = "70%"
command = ["lua", "src/main.lua", "workspaces", "all"]

[[panes]]
id = "agents-current"
title = "pickr"
placement = "popup"
width = "80%"
height = "70%"
command = ["lua", "src/main.lua", "agents", "current"]

[[panes]]
id = "agents-all"
title = "pickr"
placement = "popup"
width = "80%"
height = "70%"
command = ["lua", "src/main.lua", "agents", "all"]
