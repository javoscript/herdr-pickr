id = "javoscript.herdr-pickr"
name = "Herdr Pickr"
version = "0.3.0"
min_herdr_version = "0.9.0"
description = "Fuzzy tab, space, agent, and pane pickers with terminal previews."
platforms = ["macos", "linux"]

[[actions]]
id = "tabs-space"
title = "Pickr: tabs in this space"
contexts = ["global"]
command = ["lua", "src/open.lua", "tabs-space"]

[[actions]]
id = "tabs-all"
title = "Pickr: tabs in all spaces"
contexts = ["global"]
command = ["lua", "src/open.lua", "tabs-all"]

[[actions]]
id = "spaces"
title = "Pickr: spaces"
contexts = ["global"]
command = ["lua", "src/open.lua", "spaces"]

[[actions]]
id = "agents-space"
title = "Pickr: agents in this space"
contexts = ["global"]
command = ["lua", "src/open.lua", "agents-space"]

[[actions]]
id = "agents-all"
title = "Pickr: agents in all spaces"
contexts = ["global"]
command = ["lua", "src/open.lua", "agents-all"]

[[actions]]
id = "panes-tab"
title = "Panes in this tab"
contexts = ["global"]
command = ["lua", "src/open.lua", "panes-tab"]

[[actions]]
id = "panes-space"
title = "Panes in this space"
contexts = ["global"]
command = ["lua", "src/open.lua", "panes-space"]

[[actions]]
id = "panes-all"
title = "Panes in all spaces"
contexts = ["global"]
command = ["lua", "src/open.lua", "panes-all"]

[[panes]]
id = "tabs-space"
title = "pickr"
placement = "popup"
width = "80%"
height = "70%"
command = ["lua", "src/main.lua", "tabs", "space"]

[[panes]]
id = "tabs-all"
title = "pickr"
placement = "popup"
width = "80%"
height = "70%"
command = ["lua", "src/main.lua", "tabs", "all"]

[[panes]]
id = "spaces"
title = "pickr"
placement = "popup"
width = "80%"
height = "70%"
command = ["lua", "src/main.lua", "spaces"]

[[panes]]
id = "agents-space"
title = "pickr"
placement = "popup"
width = "80%"
height = "70%"
command = ["lua", "src/main.lua", "agents", "space"]

[[panes]]
id = "agents-all"
title = "pickr"
placement = "popup"
width = "80%"
height = "70%"
command = ["lua", "src/main.lua", "agents", "all"]

[[panes]]
id = "panes-tab"
title = "Panes in this tab"
placement = "popup"
width = "80%"
height = "70%"
command = ["lua", "src/main.lua", "panes", "tab"]

[[panes]]
