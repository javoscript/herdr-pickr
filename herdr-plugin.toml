title = "Panes in this space"
placement = "popup"
width = "80%"
height = "70%"
command = ["lua", "src/main.lua", "panes", "space"]

[[panes]]
id = "panes-all"
title = "Panes in all spaces"
placement = "popup"
width = "80%"
height = "70%"
command = ["lua", "src/main.lua", "panes", "all"]

[[actions]]
id = "tabs"
title = "Pickr: tabs in all spaces"
contexts = ["global"]
